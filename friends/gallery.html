<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Hfitsi Eanyt Jubtre</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=1887&auto=format&fit=crop" alt="Profile Photo" class="navbar-profile-pic"/>
        <span class="navbar-brand-name">Hfitsi Eanyt Jubtre</span>
      </a>
      <div class="theme-toggle-container ms-auto">
        <input type="checkbox" class="theme-checkbox" id="themeToggleCheckbox" aria-label="Toggle theme">
        <label for="themeToggleCheckbox" class="theme-toggle-label">
          <i class="fas fa-moon"></i><i class="fas fa-sun"></i>
          <span class="theme-ball"></span>
        </label>
      </div>
    </div>
  </nav>

  <!-- GALLERY MAIN CONTENT -->
  <main class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-4 section-title">Gallery</h1>
      <p class="lead text-muted">A collection of my favorite creations and moments.</p>
    </div>

    <!-- UPLOAD SECTION -->
    <div class="text-center mb-5" id="upload-section">
      <button id="upload-widget-button" class="btn btn-hero-cta"><i class="fas fa-upload me-2"></i> Upload New Creation</button>
    </div>

    <!-- IMAGE GRID -->
    <div id="gallery-grid" class="gallery-grid">
      <div class="text-center w-100"><div class="spinner-border text-accent" style="width: 3rem; height: 3rem;" role="status"></div></div>
    </div>
  </main>
  
  <!-- FOOTER -->
  <footer class="py-4 mt-5 text-center bg-dark text-white">
    <p class="mb-1">© <span id="currentYear"></span> Hfitsi Eanyt Jubtre. All Rights Reserved.</p>
    <p class="text-white-50 small mb-0">Designed & Developed with <i class="fas fa-heart text-danger"></i> by Uma Sankar K</p>
  </footer>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script src="script.js"></script>
</body>
</html>
