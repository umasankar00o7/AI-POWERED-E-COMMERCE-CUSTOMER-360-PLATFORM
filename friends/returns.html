<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returns & Exchange Portal</title>
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Re-use main shop CSS for theme consistency -->
    <link rel="stylesheet" href="shop.css"> 
    <!-- Custom RMA styling -->
    <style>
        
        /* Responsive RMA Container */
        .rma-container {
            max-width: 600px;
            margin: 0 auto; /* Remove top margin, rely on content padding */
            padding: 30px; /* Increased padding */
            background-color: var(--bg-card);
            border-radius: 16px; /* Smoother corners */
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15); /* Deeper shadow */
            border: none; /* Removed border */
        }
        
        /* New Top Bar for Back Button (Replaces Navbar) */
        .rma-top-bar {
            max-width: 600px;
            margin: 20px auto 10px auto;
            padding: 0 10px;
        }

        /* Page Header */
        .rma-container h2 {
            font-family: var(--font-heading);
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .rma-container .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-align: center;
        }
        
        /* Section Headings (Elegant & Clear) */
        .rma-container h5 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1.8rem;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-primary);
        }

        /* Form Controls */
        .form-control, .form-select {
            background-color: var(--bg-secondary) !important;
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            transition: border-color 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 0.15rem rgba(230, 195, 78, 0.2) !important;
        }
        
        /* Confirmation Screen */
        .rma-confirmation {
            padding: 2rem;
            text-align: center;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            color: var(--text-primary);
        }

        /* --- FLOATING HOME BUTTON (WOW FACTOR) --- */
        .floating-home-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--accent-text);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
            
            /* Vertical Breathing/Floating Animation */
            animation: breathe-float 2s infinite ease-in-out;
        }
        
        @keyframes breathe-float {
            0% { transform: translateY(0); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
            50% { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
            100% { transform: translateY(0); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        }

        /* Mobile Adjustments */
        @media (max-width: 576px) {
            .floating-home-btn {
                width: 50px;
                height: 50px;
                right: 15px;
                bottom: 15px;
            }
        }
    
        /* Image Preview Style */
        #image-preview-container img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        /* --- Micro Notification Styles (Reusing existing components) --- */
        .micro-alert-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
        }
        .micro-alert {
            background-color: var(--accent);
            color: var(--accent-text);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            transform: translateY(20px);
        }
        .micro-alert.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="light-mode">
    
    <!-- 1. Simple Back-to-Shop Link (Replaces Navbar) -->
    <div class="rma-top-bar">
        <a href="shop.html" class="text-decoration-none" style="color: var(--accent); font-weight: 600;">
            <i class="bi bi-arrow-left me-2"></i> Back to Shop Home
        </a>
    </div>

    <!-- RMA Form Container -->
    <div class="container">
        <div class="rma-container">
            <h2>Start Your Return / Exchange</h2>
            <p class="subtitle">Please fill out the form below to receive your RMA number quickly.</p>
            
            <form id="rma-submission-form" enctype="multipart/form-data">
                <!-- Step 1: Order Identification -->
                <h5><i class="bi bi-tag me-2"></i> Order Identification</h5>
                <!-- === NEW CUSTOMER NAME FIELD === -->
                <div class="mb-3">
                    <label for="customerName" class="form-label small">Your Full Name*</label>
                    <input type="text" class="form-control" id="customerName" required placeholder="Name used for the order">
                </div>
                <!-- === END NEW FIELD === -->
                <div class="mb-3">
                    <label for="orderId" class="form-label small">Order Reference / Invoice ID*</label>
                    <input type="text" class="form-control" id="orderId" required placeholder="e.g., INVOICE-12345">
                </div>
                 <div class="mb-3">
                    <label for="customerEmail" class="form-label small">Email Address*</label>
                    <input type="email" class="form-control" id="customerEmail" required placeholder="Email used for the order">
                </div>
                <div class="mb-3">
                    <label for="customerPhone" class="form-label small">WhatsApp Phone Number*</label>
                    <input type="tel" class="form-control" id="customerPhone" required placeholder="+91 98765 43210">
                </div>
                
                <!-- Step 2: Item and Reason -->
                <h5><i class="bi bi-question-circle me-2"></i> Reason & Resolution</h5>
                <div class="mb-3">
                    <label for="rmaReason" class="form-label small">Reason for Return/Exchange*</label>
                    <select class="form-select" id="rmaReason" required>
                        <option value="">Select Reason...</option>
                        <option value="Damaged">Received Damaged/Defective Item</option>
                        <option value="Incorrect">Incorrect Item Shipped</option>
                        <option value="Size">Wrong Size/Fit</option>
                        <option value="Quality">Dissatisfied with Quality/Color</option>
                        <option value="Other">Other (Please specify below)</option>
                    </select>
                </div>

                <div class="mb-3" id="other-reason-field" style="display:none;">
                    <label for="customReason" class="form-label small">Custom Reason Details*</label>
                    <textarea class="form-control" id="customReason" rows="3" placeholder="Please describe the issue in detail."></textarea>
                </div>

                <div class="mb-3">
                    <label for="rmaResolution" class="form-label small">Desired Resolution*</label>
                    <select class="form-select" id="rmaResolution" required>
                        <option value="Refund">Full Refund (Original Payment Method)</option>
                        <option value="Credit">Store Credit</option>
                        <option value="Exchange">Product Exchange</option>
                    </select>
                </div>

                <!-- Step 3: Photo Proof (Cloudinary Integration) -->
                <h5><i class="bi bi-camera me-2"></i> Photo Proof (Optional)</h5>
                <div class="mb-3">
                    <input class="form-control" type="file" id="photoProof" accept="image/*">
                    <small class="text-secondary small">Upload a photo to speed up processing (Max 1 file).</small>
                    <div id="image-preview-container" class="mt-2"></div>
                </div>

                <button type="submit" id="submit-rma-btn" class="btn btn-main w-100 mt-4">
                    Submit Return Request
                </button>
                <div id="loading-spinner" class="text-center mt-3 d-none">
                    <div class="spinner-border text-primary"></div>
                    <p class="text-secondary small mt-2">Processing secure file upload...</p>
                </div>
            </form>
            
            <!-- Dynamic Confirmation Screen -->
            <div id="rma-confirmation-screen" class="d-none"></div>

        </div>
    </div>
    
    <!-- 2. Floating Home Button (WOW Factor) -->
    <a href="shop.html" class="floating-home-btn" title="Back to Shop Home">
        <i class="bi bi-house-door-fill"></i>
    </a>

    <!-- Micro Notification Container (Keep below the form) -->
    <div class="micro-alert-container" id="micro-alert-container"></div>


    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- === RMA CUSTOMER SUBMISSION LOGIC (Standalone) === -->
    <script>
    // --- 1. CONFIG & INITIALIZATION ---
    const CLOUDINARY_CLOUD_NAME = 'doxabh7af'; 
    const CLOUDINARY_UPLOAD_PRESET = 'rma_unsigned_uploads';
    
    const firebaseConfig = { apiKey: "AIzaSyDnS_o6asJeO6J6eUTZA7f3ONfmUJK6t_g", authDomain: "jewellery-308b1.firebaseapp.com", projectId: "jewellery-308b1", messagingSenderId: "275610166334", appId: "1:275610166334:web:5290beefa8cadae4415d6f" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    const rmaForm = document.getElementById('rma-submission-form');
    const submitBtn = document.getElementById('submit-rma-btn');
    const loadingSpinner = document.getElementById('loading-spinner');
    const rmaReasonSelect = document.getElementById('rmaReason');
    const otherReasonField = document.getElementById('other-reason-field');
    const photoInput = document.getElementById('photoProof');
    const confirmationScreen = document.getElementById('rma-confirmation-screen');


    // --- 2. MICRO NOTIFICATION SYSTEM ---
    function showMicroAlert(title, type = 'info') {
        const container = document.getElementById('micro-alert-container');
        const alertDiv = document.createElement('div');
        alertDiv.className = `micro-alert bg-${type} text-white`;
        alertDiv.innerHTML = `<i class="bi bi-bell-fill me-2"></i> ${title}`;
        
        container.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.classList.add('show');
        }, 10);

        setTimeout(() => {
            alertDiv.classList.remove('show');
            alertDiv.addEventListener('transitionend', () => alertDiv.remove());
        }, 4000);
    }
    
    // --- 3. CLOUDINARY UPLOAD LOGIC ---
    async function uploadImageToCloudinary(file) {
        if (!file || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUDINARY_CLOUD_NAME') {
            return null; // Skip if no file or not configured
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        formData.append('folder', 'rma_proofs'); // Optional: organize images

        const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            return data.secure_url; // Returns the public image URL
        } catch (error) {
            console.error("Cloudinary Upload Error:", error);
            showMicroAlert("Image upload failed.", 'danger');
            return null;
        }
    }

    // --- 4. FORM SUBMISSION ---
    rmaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const orderId = document.getElementById('orderId').value.trim();
        const customerName = document.getElementById('customerName').value.trim();
        const email = document.getElementById('customerEmail').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const reason = rmaReasonSelect.value;
        const resolution = document.getElementById('rmaResolution').value;
        const customReason = document.getElementById('customReason').value.trim();
        const photoFile = photoInput.files[0];

        // Basic Validation
         if (!customerName || !orderId || !email || !phone || !reason) {
            showMicroAlert("❌ All fields are required.", 'warning');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';
        loadingSpinner.classList.remove('d-none');
        
        let photoUrl = null;
        
        // 1. Upload Photo to Cloudinary
        if (photoFile) {
            photoUrl = await uploadImageToCloudinary(photoFile);
        }

        // 2. Determine the next sequential RMA ID (Simulated - Admin script will make this robust)
        // For a public facing form, we just ensure the document is created.

        const rmaData = {
            customerName: customerName,
            orderId: orderId,
            customerEmail: email,
            customerPhone: phone,
            reason: reason,
            customReason: reason === 'Other' ? customReason : null,
            resolution: resolution,
            photoUrl: photoUrl,
            status: 'Pending Review',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // 3. Save RMA Request to Firestore
            const docRef = await db.collection('rma_requests').add(rmaData);
            
            // 4. Show Success Screen (RMA-XXXXX simulation)
            const rmaNumber = `RMA-${docRef.id.substring(0, 8).toUpperCase()}`;
            
            rmaForm.classList.add('d-none');
            confirmationScreen.classList.remove('d-none');
            confirmationScreen.innerHTML = `
                <div class="rma-confirmation">
                    <i class="bi bi-check-circle-fill"></i>
                    <h3>Request Submitted Successfully!</h3>
                    <p class="lead">Your Return Merchandise Authorization (RMA) number is:</p>
                    <h4 class="text-primary fw-bold">${rmaNumber}</h4>
                    <p>We will review your request and contact you via WhatsApp/Email within 1-2 business days.</p>
                    <a href="shop.html" class="btn btn-main mt-3">Back to Shop</a>
                </div>
            `;
            
            // 5. CRITICAL WOW FACTOR: Show Micro Notification
            showMicroAlert(`✅ RMA ${rmaNumber} Submitted! Check email for details.`, 'success');

        } catch (error) {
            console.error("RMA Submission Error:", error);
            showMicroAlert("Submission Failed. Please try again.", 'danger');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Return Request';
        } finally {
            loadingSpinner.classList.add('d-none');
        }
    });

    // --- 5. UI EVENT HANDLERS ---
    
    // Toggle Custom Reason Field
    rmaReasonSelect.addEventListener('change', () => {
        if (rmaReasonSelect.value === 'Other') {
            otherReasonField.style.display = 'block';
            document.getElementById('customReason').setAttribute('required', 'required');
        } else {
            otherReasonField.style.display = 'none';
            document.getElementById('customReason').removeAttribute('required');
        }
    });

    // Image Preview
    photoInput.addEventListener('change', () => {
        const file = photoInput.files[0];
        const previewContainer = document.getElementById('image-preview-container');
        previewContainer.innerHTML = '';
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewContainer.innerHTML = `<img src="${e.target.result}" alt="Proof Image">`;
            };
            reader.readAsDataURL(file);
        }
    });

    // Apply shop.css light mode to the body for consistency
    document.body.classList.add('light-mode');
    </script>
</body>
</html>
